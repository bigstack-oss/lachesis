version: "3"

dotenv: [ ".env" ]

vars:
  BUILDER_IMAGE: ebpf-builder
  BUILD_DIR: build
  BINARY: "{{.BUILD_DIR}}/network-telemetry"

  SSH_HOST: "{{default \"remote-server\" .SSH_HOST}}"
  SSH_USER: "{{default \"root\" .SSH_USER}}"
  SCP_DEST: "{{default \"/tmp\" .SCP_DEST}}"

  UID: "{{default \"1000\" .UID}}"
  GID: "{{default \"1000\" .GID}}"

tasks:
  setup:
    desc: Build/Rebuild the Docker image for the builder environment
    cmd: docker build --platform linux/amd64 -t {{.BUILDER_IMAGE}} .
    sources: [ Dockerfile ]

  headers:
    desc: Populate .include/ with libbpf/kernel headers and generate vmlinux.h from
      the builder image
    deps: [ setup ]
    sources:
      - Dockerfile
    generates:
      - .include/vmlinux.h
      - .include/bpf/bpf_helpers.h
    cmds:
      - rm -rf .include/bpf .include/asm .include/asm-generic .include/linux .include/vmlinux.h
      - mkdir -p .include
      - |
        cid=$(docker create --platform linux/amd64 {{.BUILDER_IMAGE}})
        docker cp $cid:/usr/include/bpf .include/bpf
        docker cp $cid:/usr/include/x86_64-linux-gnu/asm .include/asm
        docker cp $cid:/usr/include/asm-generic .include/asm-generic
        docker cp $cid:/usr/include/linux .include/linux
        docker rm $cid
      - >
        docker run --rm --privileged --platform linux/amd64
        -v "$(pwd)/.include":/out
        {{.BUILDER_IMAGE}}
        sh -c "bpftool btf dump file /sys/kernel/btf/vmlinux format c > /out/vmlinux.h && chown {{.UID}}:{{.GID}} /out/vmlinux.h"

  generate:
    desc: Generate BPF Go bindings only if C code or headers changed
    deps: [ headers ]
    sources:
      - bpf/*.c
      - .include/*
    generates:
      - internal/bpf/telemetry_bpfel.go
      - internal/bpf/telemetry_bpfel.o
    cmd: >
      docker run --rm --platform linux/amd64 -v "$(pwd)":/app -u
      {{.UID}}:{{.GID}} {{.BUILDER_IMAGE}} go generate ./internal/bpf/...

  binary:
    desc: Full build (generate + compile)
    deps: [ generate ]
    sources:
      - cmd/**/*.go
      - internal/**/*.go
    generates:
      - "{{.BINARY}}"
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >
        docker run --rm --platform linux/amd64 -v "$(pwd)":/app -u
        {{.UID}}:{{.GID}} -e GOOS=linux -e GOARCH=amd64 {{.BUILDER_IMAGE}} go
        build -o {{.BINARY}} ./cmd/...

  remote-binary:
    desc: Build binary and copy it to a remote server
    deps: [ binary ]
    cmd: >
      scp {{.BINARY}} {{.SSH_USER}}@{{.SSH_HOST}}:{{.SCP_DEST}}

  clean:
    desc: Remove build artifacts
    cmd: rm -rf build/ internal/bpf/*_bpfel.go internal/bpf/*_bpfel.o
