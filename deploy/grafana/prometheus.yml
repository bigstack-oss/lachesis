global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: lachesis-local

# Alerting rules. severity="page" routes to the on-call via Alertmanager
# in a real deployment; the local demo ships no Alertmanager, so firing
# rules surface in Prometheus's /alerts UI instead.
rule_files:
  - /etc/prometheus/alerts.rules.yml
  - /etc/prometheus/recording.rules.yml

scrape_configs:
  # The agent. Edit the target if you run the agent somewhere other
  # than the host machine reachable via the Docker host gateway.
  - job_name: lachesis-agent
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9090']
        labels:
          instance: agent-local
