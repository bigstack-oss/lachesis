{{ define "style" }}
<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 1rem 1.5rem; color: #222; }
  h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
  h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; border-bottom: 1px solid #ddd; padding-bottom: 0.2rem; }
  h3 { font-size: 0.9rem; margin: 0.9rem 0 0.3rem; font-weight: 600; }
  .meta { color: #666; font-size: 0.85rem; margin-bottom: 1rem; }
  nav a { margin-right: 1rem; font-size: 0.85rem; }
  table { border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 3px 10px; text-align: left; border: 1px solid #ddd; vertical-align: top; }
  th { background: #f4f4f4; }
  tbody tr:nth-child(even) { background: #fafafa; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.uuid, span.uuid { color: #888; font-size: 0.78rem; }
  .empty { color: #888; font-style: italic; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.8rem; background: #eef4ff; color: #246; }
  .badge.warn { background: #fee; color: #900; }
  .badge.ok { background: #efe; color: #060; }
  .help { font-size: 0.8rem; color: #666; margin: 0.4rem 0 0.8rem; max-width: 60rem; }
  form.lookup { display: flex; flex-wrap: wrap; gap: 0.4rem 0.75rem; align-items: center; margin: 0.4rem 0 0.6rem; }
  form.lookup label { font-size: 0.85rem; color: #444; }
  form.lookup input { font-family: inherit; padding: 3px 6px; border: 1px solid #bbb; min-width: 14rem; }
  form.lookup button { font-family: inherit; padding: 4px 12px; border: 1px solid #246; background: #246; color: #fff; cursor: pointer; }
  form.lookup button:hover { background: #357; }
  .lookup-err { background: #fee; border: 1px solid #b22; padding: 0.5rem 0.75rem; color: #900; font-size: 0.85rem; margin: 0.4rem 0; }
  .lookup-result { background: #fafafa; border: 1px solid #ddd; padding: 0.6rem 0.8rem; margin-top: 0.5rem; max-width: 60rem; }
  .lookup-result h3 { margin-top: 0; }
  .lookup-result .label { color: #666; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; display: inline-block; min-width: 5.5rem; }
  .lookup-result .row { margin: 2px 0; }
  .controls { margin: 0 0 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
  select { font-family: inherit; padding: 2px 4px; }
  td.global, td.muted { color: #888; }
  td.zero { color: #aaa; }
  a.tenant { color: #246; text-decoration: none; }
  a.tenant:hover { text-decoration: underline; }
  .summary { color: #444; font-size: 0.85rem; margin-bottom: 0.5rem; }
  .summary .badge { display: inline-block; margin-right: 0.75rem; }
  .summary .cross { color: #d80; font-weight: 600; }
  .kind-shared { color: #888; }
  .kind-external { color: #b22; }
  .cross-mark { color: #d80; font-weight: 600; margin-left: 0.4rem; text-decoration: none; }
  .router-card { margin-bottom: 1.2rem; padding: 0.5rem 0.75rem; border: 1px solid #e4e4e4; border-radius: 4px; background: #fafafa; max-width: 80rem; }
  .router-card .ext { color: #b22; font-size: 0.85rem; margin-bottom: 0.3rem; }
  .router-card .ext.none { color: #888; }
  .router-card .empty { color: #888; font-size: 0.85rem; }
  .router-card table { font-size: 0.8rem; margin-top: 0.25rem; }
  .router-card .subhead { font-size: 0.78rem; color: #666; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.35rem; }
  .zone-external     { color: #b22; }
  .zone-same_tenant  { color: #2a6; }
  .zone-other_tenant { color: #d80; }
  .zone-infra        { color: #44a; }
  .zone-shared       { color: #888; }
  .zone-miss         { color: #a4a; }
</style>
{{ end }}
