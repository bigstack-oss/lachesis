name: Merge on done label

# Replaces the previous `gh pr merge --auto` flow. That approach handed
# the merge off to GitHub's deferred auto-merge queue, which fired with an
# expired GITHUB_TOKEN; the repo-level `delete_branch_on_merge` setting
# then silently skipped the head-branch deletion.
#
# Here we instead perform the merge synchronously: wait for required
# checks to pass inside this workflow run, then call `gh pr merge` with
# an active token. The merge — and the branch deletion — happen while we
# still hold `contents: write`, so both succeed reliably. Same pattern
# the cubecos repo uses.

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  # `gh pr checks --watch --required` walks the head commit's
  # statusCheckRollup (checks/statuses scopes) and then drills into
  # each check's checkSuite.workflowRun (actions scope) to surface
  # the run URL. Missing any of the three returns "Resource not
  # accessible by integration" even though the workflow can write
  # to PRs.
  checks: read
  statuses: read
  actions: read

jobs:
  merge:
    if: github.event.label.name == 'done'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # gh cli infers the repo from the working directory's .git
      # config; we don't actions/checkout the repo (the steps are
      # API-only), so pass --repo explicitly. GITHUB_REPOSITORY is
      # provided by the runner in "owner/repo" form.
      REPO: ${{ github.repository }}
    steps:
      - name: Wait for required checks
        run: gh pr checks "$PR_NUMBER" --repo "$REPO" --watch --required

      - name: Merge (rebase + delete head branch)
        run: gh pr merge "$PR_NUMBER" --repo "$REPO" --rebase --delete-branch
