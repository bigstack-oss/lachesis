name: Delete merged head branch

# Why this exists:
# The repo-level "Automatically delete head branches" setting is
# unreliable when a pull request is merged by a GitHub App / Action
# (our automerge.yml fires `gh pr merge --auto` under GITHUB_TOKEN,
# and the token's `contents: write` scope expires before the auto-merge
# actually completes). This workflow runs in its own context, with a
# fresh token, and deletes the branch explicitly.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    # Only act when:
    #  - the PR was actually merged (not just closed)
    #  - the head branch belongs to this repo (skip forks)
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO:   ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api -X DELETE "/repos/$REPO/git/refs/heads/$BRANCH"; then
            echo "Deleted refs/heads/$BRANCH"
          else
            echo "Branch already absent or protected — ignoring"
          fi
