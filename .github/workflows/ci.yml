name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # internal/bpf imports bpf2go-generated types; need the generate step
      # to materialize them before plain `go build`/`go test` can compile.
      - run: task setup
      - run: task generate UID=0 GID=0
      - run: go build ./internal/...
      - run: go test ./internal/...

  integration:
    name: integration (linux, privileged docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: build BPF builder image
        run: task setup
      - name: generate BPF bindings
        # UID=0/GID=0 so bpf2go's docker run can write to runner-owned dirs.
        run: task generate UID=0 GID=0
      - name: run integration tests
        run: task test-integration

  bench-gate:
    name: bench-gate (zero-allocation check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # bench-gate.sh runs `go test`, which compiles internal/bpf and needs
      # the bpf2go-generated types.
      - run: task setup
      - run: task generate UID=0 GID=0
      - run: ./scripts/bench-gate.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # golangci-lint typechecks the tree, which compiles internal/bpf and
      # needs the bpf2go-generated types.
      - run: task setup
      - run: task generate UID=0 GID=0
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --build-tags=integration
