name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # internal/bpf imports bpf2go-generated types; need the generate step
      # to materialize them before plain `go build`/`go test` can compile.
      - run: task setup
      - run: task generate UID=0 GID=0
      # ./... not ./internal/... — cmd/'s tests (scenariotest CLI,
      # scenario registry invariants) never ran in CI and a stale
      # hardcoded test slipped through a green build once.
      - run: go build ./...
      - run: go test ./...

  integration:
    name: integration (linux, privileged docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: build BPF builder image
        run: task setup
      - name: generate BPF bindings
        # UID=0/GID=0 so bpf2go's docker run can write to runner-owned dirs.
        run: task generate UID=0 GID=0
      - name: run integration tests
        run: task test-integration

  bench-gate:
    name: bench-gate (zero-allocation check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # bench-gate.sh runs `go test`, which compiles internal/bpf and needs
      # the bpf2go-generated types.
      - run: task setup
      - run: task generate UID=0 GID=0
      - run: ./scripts/bench-gate.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # golangci-lint typechecks the tree, which compiles internal/bpf and
      # needs the bpf2go-generated types.
      - run: task setup
      - run: task generate UID=0 GID=0
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2
          args: --build-tags=integration
